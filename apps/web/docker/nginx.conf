worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main 'request_id=$request_id method=$request_method '
    'status=$status bytes=$body_bytes_sent duration=$request_time';
  access_log /dev/stdout main;

  limit_req_zone $http_x_forwarded_for zone=api_per_client:10m rate=10r/s;
  # Keep an HTTPS indication supplied by the outer OCI Nginx proxy. Local
  # Compose traffic has no forwarded value, so it correctly falls back to HTTP.
  map $http_x_forwarded_proto $zampayroll_forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
  }
  client_max_body_size 1m;
  sendfile on;
  keepalive_timeout 65;
  server_tokens off;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  include /etc/nginx/conf.d/*.conf;
}
